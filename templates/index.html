<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personalized Learning Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Personalized Learning Platform</h1>
        <p>
            AI-based learning path recommendation based on student profile
            and performance.
        </p>
    </div>


    <div class="form-card">

        <h2>Student Information</h2>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Age</label>
                    <input type="number"
                           name="age"
                           value="20"
                           required>
                </div>


                <div class="form-group">
                    <label>Education Level</label>

                    <select name="education_level">
                        <option value="High School">
                            High School
                        </option>

                        <option value="Bachelor" selected>
                            Bachelor
                        </option>

                        <option value="Master">
                            Master
                        </option>

                        <option value="PhD">
                            PhD
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label>Learning Style</label>

                    <select name="learning_style">

                        <option value="Visual" selected>
                            Visual
                        </option>

                        <option value="Auditory">
                            Auditory
                        </option>

                        <option value="Reading">
                            Reading
                        </option>

                        <option value="Kinesthetic">
                            Kinesthetic
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Preferred Topic</label>

                    <select name="preferred_topics">

                        <option value="AI" selected>
                            Artificial Intelligence
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Math">
                            Mathematics
                        </option>

                        <option value="Art">
                            Art
                        </option>

                        <option value="History">
                            History
                        </option>

                        <option value="Music">
                            Music
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label>Assessment Score</label>

                    <input type="number"
                           name="assessment_score"
                           value="75"
                           min="0"
                           max="100"
                           required>
                </div>


                <div class="form-group">
                    <label>Feedback Score</label>

                    <input type="number"
                           name="feedback_score"
                           value="4.2"
                           min="0"
                           max="5"
                           step="0.1"
                           required>
                </div>


                <div class="form-group">
                    <label>Engagement Score</label>

                    <input type="number"
                           name="engagement_score"
                           value="0.70"
                           min="0"
                           max="1"
                           step="0.01"
                           required>
                </div>


                <div class="form-group">
                    <label>Completion Status</label>

                    <select name="completion_status">

                        <option value="Not Started">
                            Not Started
                        </option>

                        <option value="In Progress" selected>
                            In Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>
                </div>


                <div class="form-group full-width">

                    <label>Performance Score</label>

                    <input type="number"
                           name="performance_score"
                           value="0.68"
                           min="0"
                           max="1"
                           step="0.01"
                           required>

                </div>

            </div>


            <button type="submit" class="submit-btn">
                Generate Personalized Learning Path
            </button>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
